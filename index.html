<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Live Feed</title>
<style>
  :root {
    --accent: #4f9dff;
    --accent-off: #ff5c5c;
    --text: #e8eaed;
    --text-dim: #8a8f98;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Full-screen video */
  #video {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    display: none;
  }

  /* Full-screen placeholder shown before the camera starts */
  #placeholder {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    text-align: center;
    padding: 0 24px;
  }
  #placeholder h1 {
    font-size: 1.3rem;
    font-weight: 600;
    margin: 0;
  }
  #placeholder p {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin: 0;
    max-width: 320px;
  }

  /* Small live indicator, top-left, always minimal */
  .badge {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: 14px;
    background: rgba(0,0,0,0.5);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    display: none;
    align-items: center;
    gap: 6px;
    z-index: 5;
    pointer-events: none;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3ecf6a;
    box-shadow: 0 0 8px #3ecf6a;
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Toggle button, always visible, floats top-right */
  #toggleBtn {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    right: 14px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text);
    font-size: 1.2rem;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    cursor: pointer;
  }

  /* Bottom controls panel — slides away when toggled off */
  #controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    padding: 16px max(16px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,0.65), transparent);
    z-index: 8;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }
  #controls.hidden {
    transform: translateY(120%);
    opacity: 0;
    pointer-events: none;
  }

  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  button.secondary {
    background: rgba(255,255,255,0.12);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.2);
  }
  button.stop {
    background: var(--accent-off);
  }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Snapshot preview, shown as a full-screen overlay */
  #snapshotOut {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 20;
    padding: 24px;
  }
  #snapshotOut img {
    max-width: 92vw;
    max-height: 75vh;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  .timestamp {
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  #closeSnapBtn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
  }
</style>
</head>
<body>

  <video id="video" autoplay playsinline muted></video>

  <div id="placeholder">
    <h1>Live Feed</h1>
    <p>Tap "Start Feed" to turn on the camera. It fills the screen — tap anywhere to show or hide the controls.</p>
    <button id="startBtn">Start Feed</button>
  </div>

  <div class="badge" id="liveBadge"><span class="dot"></span> LIVE</div>
  <button id="toggleBtn" aria-label="Show or hide controls">⋮</button>

  <div id="controls" class="hidden">
    <button id="stopBtn" class="stop" disabled>Stop</button>
    <button id="switchBtn" class="secondary" disabled>Switch Camera</button>
    <button id="snapBtn" class="secondary" disabled>Snapshot</button>
  </div>

  <div id="snapshotOut">
    <img id="snapImg" alt="Snapshot">
    <div class="timestamp" id="snapTime"></div>
    <button id="closeSnapBtn">Close</button>
  </div>

<script>
  const video = document.getElementById('video');
  const placeholder = document.getElementById('placeholder');
  const liveBadge = document.getElementById('liveBadge');
  const toggleBtn = document.getElementById('toggleBtn');
  const controls = document.getElementById('controls');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const switchBtn = document.getElementById('switchBtn');
  const snapBtn = document.getElementById('snapBtn');
  const snapshotOut = document.getElementById('snapshotOut');
  const snapImg = document.getElementById('snapImg');
  const snapTime = document.getElementById('snapTime');
  const closeSnapBtn = document.getElementById('closeSnapBtn');

  let currentStream = null;
  // Default to the rear camera, since this is meant to run on a phone.
  let facingMode = 'environment';
  let controlsVisible = false;

  async function startFeed() {
    try {
      const constraints = { video: { facingMode }, audio: false };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      currentStream = stream;
      video.srcObject = stream;
      video.style.display = 'block';
      placeholder.style.display = 'none';
      liveBadge.style.display = 'flex';
      toggleBtn.style.display = 'flex';
      stopBtn.disabled = false;
      switchBtn.disabled = false;
      snapBtn.disabled = false;
      setControlsVisible(false);
    } catch (err) {
      placeholder.querySelector('p').textContent =
        'Could not access the camera (' + err.message + '). Check permissions and try again.';
    }
  }

  function stopFeed() {
    if (currentStream) {
      currentStream.getTracks().forEach(track => track.stop());
      currentStream = null;
    }
    video.srcObject = null;
    video.style.display = 'none';
    liveBadge.style.display = 'none';
    toggleBtn.style.display = 'none';
    placeholder.style.display = 'flex';
    placeholder.querySelector('p').textContent =
      'Tap "Start Feed" to turn on the camera. It fills the screen — tap anywhere to show or hide the controls.';
    stopBtn.disabled = true;
    switchBtn.disabled = true;
    snapBtn.disabled = true;
    setControlsVisible(false);
  }

  async function switchCamera() {
    facingMode = facingMode === 'user' ? 'environment' : 'user';
    stopFeed();
    setTimeout(startFeed, 200);
  }

  function takeSnapshot() {
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    snapImg.src = canvas.toDataURL('image/png');
    snapTime.textContent = 'Captured ' + new Date().toLocaleString();
    snapshotOut.style.display = 'flex';
  }

  function setControlsVisible(visible) {
    controlsVisible = visible;
    controls.classList.toggle('hidden', !visible);
  }

  function toggleControls(e) {
    // Avoid double-toggling when the tap lands on the toggle button itself.
    if (e && e.target === toggleBtn) return;
    setControlsVisible(!controlsVisible);
  }

  startBtn.addEventListener('click', startFeed);
  stopBtn.addEventListener('click', stopFeed);
  switchBtn.addEventListener('click', switchCamera);
  snapBtn.addEventListener('click', takeSnapshot);
  toggleBtn.addEventListener('click', () => setControlsVisible(!controlsVisible));
  closeSnapBtn.addEventListener('click', () => snapshotOut.style.display = 'none');

  // Tapping anywhere on the live video toggles the controls panel.
  video.addEventListener('click', toggleControls);

  window.addEventListener('beforeunload', () => {
    if (currentStream) currentStream.getTracks().forEach(track => track.stop());
  });
</script>

</body>
</html>
